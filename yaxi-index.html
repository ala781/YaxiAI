
<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0712">
<title>YAXI AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b0712;color:#f7f2ff;
 font-family:Arial,sans-serif;min-height:100vh
}
header{
 padding:18px;background:#171023;
 border-bottom:1px solid #342346;
 display:flex;align-items:center;gap:12px
}
.logo{
 width:45px;height:45px;border-radius:14px;
 background:linear-gradient(135deg,#b56cff,#6135a5);
 display:grid;place-items:center;font-size:25px
}
h1{font-size:22px;margin:0;color:#d9baff}
header small{color:#a99bb8}
main{max-width:760px;margin:auto;padding:18px 14px 110px}
#chat{display:flex;flex-direction:column;gap:12px}
.msg{
 max-width:90%;padding:13px 15px;
 border-radius:17px;line-height:1.8;
 white-space:pre-wrap;overflow-wrap:anywhere
}
.bot{background:#21182d;border:1px solid #382747;align-self:flex-start}
.user{background:#58348a;align-self:flex-end}
.hint{text-align:center;color:#a99bb8;font-size:12px;margin:20px}
form{
 position:fixed;bottom:0;left:0;right:0;
 padding:12px;background:#120d1c;
 border-top:1px solid #342346;
 display:flex;gap:9px
}
input{
 min-width:0;flex:1;background:#21182d;color:white;
 border:1px solid #49345c;border-radius:14px;
 padding:14px;font-size:16px
}
button{
 border:0;border-radius:14px;background:#9a5be0;
 color:white;font-weight:bold;padding:0 20px;font-size:16px
}
</style>
</head>
<body>

<header>
 <div class="logo">⚡</div>
 <div>
  <h1>YAXI AI</h1>
  <small>یاریدەدەری زیرەکی تایبەتی تۆ</small>
 </div>
</header>

<main>
 <div id="chat">
  <div class="msg bot">سڵاو! من Yaxi ـم 💜
بەخێربێیت بۆ یاریدەدەری تایبەتت.
چ پرسیارێکت هەیە؟</div>
 </div>
 <div class="hint">YAXI AI · Powered by Gemini</div>
</main>

<form id="form">
 <input id="message" autocomplete="off"
 placeholder="پرسیارەکەت بنووسە..." required>
 <button id="send" type="submit">ناردن</button>
</form>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("message");
const form=document.getElementById("form");
const send=document.getElementById("send");

form.addEventListener("submit",async function(e){
 e.preventDefault();

 const q=input.value.trim();
 if(!q)return;

 const u=document.createElement("div");
 u.className="msg user";
 u.textContent=q;
 chat.appendChild(u);

 input.value="";
 send.disabled=true;

 const a=document.createElement("div");
 a.className="msg bot";
 a.textContent="Yaxi بیر دەکاتەوە... 💜";
 chat.appendChild(a);

 try{
  const response=await fetch(
   "https://yaxi-a.yaxia582.workers.dev",
   {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:q})
   }
  );

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error||"هەڵەی پەیوەندی");
  }

  a.textContent=data.answer||"وەڵام نەدراوە";

 }catch(error){
  a.textContent="ببورە! پەیوەندی بە Yaxi نەکرا. تکایە دووبارە هەوڵ بدەوە.";
 }

 send.disabled=false;
 input.focus();
 window.scrollTo(0,document.body.scrollHeight);
});
</script>

</body>
</html>
