
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0712">
<title>YAXI AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #0b0712;
  color: white;
  font-family: -apple-system, sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 20px;
  background: #171023;
  text-align: center;
  border-bottom: 1px solid #392450;
}

.logo {
  font-size: 28px;
  font-weight: bold;
  background: linear-gradient(90deg,#a855f7,#e879f9);
  -webkit-background-clip: text;
  color: transparent;
}

.status {
  color: #bda9d4;
  font-size: 13px;
  margin-top: 5px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.msg {
  padding: 12px 15px;
  border-radius: 16px;
  max-width: 85%;
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #6d28d9;
  align-self: flex-start;
}

.ai {
  background: #21172e;
  border: 1px solid #392450;
  align-self: flex-end;
}

#form {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: #171023;
  border-top: 1px solid #392450;
}

input {
  flex: 1;
  min-width: 0;
  background: #0b0712;
  color: white;
  border: 1px solid #533477;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  outline: none;
}

button {
  background: #9333ea;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 0 18px;
  font-size: 16px;
  font-weight: bold;
}

button:disabled {
  opacity: 0.5;
}
</style>
</head>

<body>

<header>
  <div class="logo">⚡ YAXI AI</div>
  <div class="status">Powered by Gemini · بە کوردی 💜</div>
</header>

<div id="chat">
  <div class="msg ai">
    سڵاو! من Yaxi AI ـم 💜
    یاریدەدەری تایبەتی تۆم.
    چۆن دەتوانم یارمەتیت بدەم؟
  </div>
</div>

<form id="form">
  <input id="input" placeholder="پرسیارەکەت بنووسە..." autocomplete="off">
  <button id="send" type="submit">ناردن</button>
</form>

<script>
const API_URL = "https://yaxi-a.yaxia582.workers.dev";

const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const message = input.value.trim();
  if (!message) return;

  addMessage(message, "user");
  input.value = "";
  send.disabled = true;

  const loading = addMessage("Yaxi بیر دەکات... 💜", "ai");

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message })
    });

    const data = await response.json();

    loading.textContent =
      data.reply || data.response || "ببورە، وەڵامێکم نییە.";

  } catch (error) {
    loading.textContent =
      "ببورە! پەیوەندی بە Yaxi نەکرا. تکایە دووبارە هەوڵ بدەوە.";
  }

  send.disabled = false;
  input.focus();
});
</script>

</body>
</html>
